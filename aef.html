<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hey Dear Ankita 💗</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Trebuchet MS",sans-serif;
  overflow:hidden;
  color:#5b315d;
}
.slide{
  position:absolute;inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}
.slide.active{display:flex;animation:fade .8s ease}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ---------- SLIDE 1 ---------- */
#s1{
 background:linear-gradient(135deg,#ffd1e6,#e8cfff,#ffc6df);
}
.card{
 background:rgba(255,255,255,.92);
 padding:45px 30px;
 border-radius:30px;
 max-width:480px;width:100%;
 box-shadow:0 20px 60px #a45a8860;
 position:relative;
}
.card:before,.card:after{
 content:"💗";position:absolute;font-size:35px;
 animation:float 3s infinite ease-in-out;
}
.card:before{left:15px;top:12px}
.card:after{right:15px;bottom:12px}
h1{font-size:clamp(30px,7vw,48px);color:#c04c86}
h2{margin:20px 0;color:#784c78}
.buttons{display:flex;justify-content:center;gap:20px;margin-top:25px}
button{
 border:0;padding:13px 28px;border-radius:30px;
 font-size:17px;cursor:pointer;
 transition:.25s;
 box-shadow:0 8px 20px #8d528840;
}
button:hover{transform:scale(1.08)}
.yes{background:#e96b9c;color:white}
.no{background:#fff;color:#b65b83;position:relative}

/* ---------- SLIDE 2 ---------- */
#s2{
 background-image:url("blob:https://gemini.google.com/4f57dc28-d29e-4123-b589-99dbcf5d442a");
 background-size:cover;background-position:center;
}
.glass{
 
 padding:40px 25px;
 border-radius:30px;
 max-width:500px;
 box-shadow:0 20px 50px #55275555;
}
.heartBtn{
 font-size:55px;background:none;
 box-shadow:none;
 animation:beat 1.2s infinite;
}
@keyframes beat{50%{transform:scale(1.2)}}

/* floating girl */
.girl{
 position:fixed;
 bottom:-100px;
 left:50%;
 font-size:65px;
 animation:girlUp 5s linear forwards;
 pointer-events:none;
}
@keyframes girlUp{
 to{bottom:105%;transform:translateX(-50%) rotate(8deg)}
}

/* ---------- SLIDE 3 ---------- */
#s3{
 background-image:url("https://images.alphacoders.com/772/thumb-1920-772587.jpg");
 background-size:cover;background-position:center;
}
.book{
 width:min(360px,90vw);
 height:450px;
 perspective:1200px;
 position:relative;
}
.page{
 position:absolute;inset:0;
 background:white;
 border-radius:10px 20px 20px 10px;
 padding:15px;
 box-shadow:0 15px 35px #5a275555;
 transform-origin:left;
 transition:1s;
 backface-visibility:hidden;
}
.page img{
 width:100%;height:100%;
 object-fit:cover;border-radius:8px;
}
.page.flipped{transform:rotateY(-180deg)}
.page:nth-child(1){z-index:5}
.page:nth-child(2){z-index:4}
.page:nth-child(3){z-index:3}
.page:nth-child(4){z-index:2}
.page:nth-child(5){z-index:1}
.flip{
 position:absolute;
 inset:0;
 background:transparent;
 border:0;
 box-shadow:none;
 z-index:10;
}

/* ---------- SLIDE 4 ---------- */
#s4{
 background:
 linear-gradient(#0004,#0005),
 url("YOUR_BIRIYANI_IMAGE_HERE") center/cover;
 color:white;
}
.final{
 animation:pop 1.5s ease;
}
.final h1{
 color:white;
 font-size:clamp(45px,10vw,80px);
 text-shadow:0 5px 20px #000;
}
@keyframes pop{
 0%{transform:scale(.5);opacity:0}
 100%{transform:scale(1);opacity:1}
}

/* music card */
.music{
 position:fixed;
 bottom:12px;
 left:50%;
 transform:translateX(-50%);
 width:min(420px,90%);
 background:#ffffffdd;
 padding:10px;
 border-radius:18px;
 z-index:100;
 box-shadow:0 8px 30px #0003;
}
.music iframe{
 width:100%;height:80px;border:0;border-radius:12px;
}

@keyframes float{
 50%{transform:translateY(-10px)}
}
</style>
</head>

<body>

<!-- ================= SLIDE 1 ================= -->
<section class="slide active" id="s1">
 <div class="card">
   <h1>Hey dear Ankita 💗</h1>
   <h2>💖 💕 💗 💕 💖</h2>
   <p style="font-size:20px">I want to say something to you...</p>

   <div class="buttons">
     <button class="yes" onclick="go(2)">Yes 💕</button>
     <button class="no" id="noBtn">No 🙈</button>
   </div>
 </div>
</section>

<!-- ================= SLIDE 2 ================= -->
<section class="slide" id="s2">
 <div class="glass">
   <h1>One little thing... 💕</h1>
   <p style="font-size:20px;margin:20px 0">
     If you wanna know what I want to say,
     click the heart 💗
   </p>

   <button class="heartBtn" onclick="go(3)">❤️</button>
 </div>

 <div class="girl">👧🏻🌸</div>
</section>

<!-- ================= SLIDE 3 ================= -->
<section class="slide" id="s3">
 <div>
   <div class="book" onclick="flipPage()">

     <!-- ADD YOUR 5 IMAGE LINKS BELOW -->
     <div class="page"><img src="file:///C:/Users/hp/Desktop/ani.png"></div>
     <div class="page"><img src="YOUR_IMAGE_2_HERE"></div>
     <div class="page"><img src="YOUR_IMAGE_3_HERE"></div>
     <div class="page"><img src="YOUR_IMAGE_4_HERE"></div>
     <div class="page"><img src="blob:https://web.whatsapp.com/595c9896-dc2c-4a2f-b1ca-bd019709cef7"></div>

     <button class="flip">📖</button>
   </div>

   <h2 style="margin:20px;color:white;text-shadow:0 2px 5px #000">
     Thanks for coming to heart 💗
   </h2>

   <button onclick="go(4)"
     style="background:#fff;color:#9b4d82">
     Click me 🌙
   </button>
 </div>
</section>

<!-- ================= SLIDE 4 ================= -->
<section class="slide" id="s4">
 <div class="final">
   <h1>From Subham 💗</h1>
   <p style="font-size:25px;margin-top:20px">
     Some feelings are better served<br>
     with biriyani & a little courage. 🥹❤️
   </p>
 </div>
</section>

<!-- ================= MUSIC ================= -->
<div class="music">

 

   <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0s76ExpXyMGVBlKLUr683e?utm_source=generator&si=aa3ec31e418b406a" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

 <iframe"
   allow="autoplay; clipboard-write; encrypted-media;
   fullscreen; picture-in-picture">
 </iframe>

</div>

<script>
/* ---------- SLIDE NAVIGATION ---------- */
function go(n){
 document.querySelectorAll(".slide")
 .forEach(s=>s.classList.remove("active"));

 document.getElementById("s"+n)
 .classList.add("active");
}

/* ---------- RUNNING NO BUTTON ---------- */
const no=document.getElementById("noBtn");

function escapeNo(){
 const maxX=window.innerWidth-no.offsetWidth-20;
 const maxY=window.innerHeight-no.offsetHeight-20;

 no.style.position="fixed";
 no.style.left=Math.random()*maxX+"px";
 no.style.top=Math.random()*maxY+"px";
}

no.addEventListener("mouseenter",escapeNo);
no.addEventListener("touchstart",e=>{
 e.preventDefault();
 escapeNo();
});

/* ---------- BOOK PAGES ---------- */
let page=0;

function flipPage(){
 const pages=document.querySelectorAll(".page");

 if(page<pages.length){
   pages[page].classList.add("flipped");
   page++;
 }
}
</script>

</body>
</html>
